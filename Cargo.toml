[workspace]
members = ["crates/core", "crates/app", "examples/note-extension", "extensions/rss"]
exclude = ["vendor/ext-reg/runtimes/core-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/InKCre/impl-rs"

[workspace.dependencies]
inkcre-core = { path = "crates/core", version = "0.1.0" }
inkcre-extension-sdk = { path = "vendor/ext-reg/runtimes/core-rs", version = "0.1.0" }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
croner = "4.0.3"
dotenvy = "0.15"
dom_smoothie = "0.19"
encoding_rs = "0.8"
feed-rs = "3"
html2text = "0.14"
infer = "0.22"
jsonwebtoken = { version = "9", default-features = false }
jsonschema = { version = "0.29", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
roxmltree = "0.20"
scraper = "0.23"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
